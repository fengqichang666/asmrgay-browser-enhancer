<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1769aa">
  <title>ASMRGay 本地索引</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-row"><h1>本地目录索引</h1><span id="status" class="status">不会访问网站 API</span></div>
      <div class="toolbar"><button id="import" type="button">导入 index.json</button><button id="play-favorites" type="button">播放收藏</button><select id="mode" aria-label="导入模式"><option value="merge">合并导入</option><option value="replace">替换导入</option></select><input id="file" class="hidden" type="file" accept="application/json,.json"></div>
      <div class="search-row"><input id="search" type="search" placeholder="搜索已导入内容"><select id="filter"><option value="all">全部</option><option value="directory">目录</option><option value="content">文件</option><option value="favorite">收藏</option></select><span id="count" class="count">0 项</span></div>
    </header>
    <section id="tree" class="tree" aria-live="polite"></section>
    <section id="player" class="player hidden" aria-label="音频播放器">
      <div class="player-top"><strong id="player-title">未选择音频</strong><button id="player-close" type="button" aria-label="关闭播放器">×</button></div>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="player-controls"><button id="player-prev" class="player-icon" type="button" aria-label="上一首" title="上一首">⏮</button><button id="player-next" class="player-icon" type="button" aria-label="下一首" title="下一首">⏭</button><button id="player-mode" class="player-icon" type="button" aria-label="单曲播放" title="单曲播放">1×</button><button id="player-favorite" class="player-icon player-favorite" type="button" aria-label="收藏" title="收藏">☆</button><button id="player-list-button" class="player-icon" type="button" aria-label="查看播放列表" title="查看播放列表">☷</button><span id="player-queue" class="player-queue"></span></div>
      <dialog id="queue-dialog" class="queue-dialog" aria-labelledby="player-list-summary"><div class="queue-dialog-header"><strong id="player-list-summary">当前播放列表</strong><button id="queue-dialog-close" class="player-icon" type="button" aria-label="关闭播放列表">×</button></div><div id="player-queue-list"></div></dialog>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
